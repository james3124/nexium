name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build assets for (e.g. v0.8.0)"
        required: true

permissions:
  contents: write

jobs:
  binaries:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install arm64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --bin nexium --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          binary=nexium
          source="target/${TARGET}/release/nexium"
          if [ "${PLATFORM}" = "win32" ]; then
            source="${source}.exe"
            binary=nexium.exe
          fi
          cp "${source}" "dist/${binary}"
          asset="nexium-${TAG}-${PLATFORM}-${ARCH}.tar.gz"
          tar -czf "dist/${asset}" -C dist "${binary}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.tar.gz

  npm:
    name: publish npm package
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is not configured; skipping publish."
            exit 0
          fi
          version="${TAG#v}"
          case "${version}" in
            *[!0-9A-Za-z.+-]*|"") echo "invalid tag: ${TAG}"; exit 1 ;;
          esac
          if npm view "nexiumx@${version}" version >/dev/null 2>&1; then
            echo "nexiumx@${version} is already published; skipping."
            exit 0
          fi
          npm version "${version}" --no-git-tag-version --allow-same-version
          npm publish --access public
